name: Synthetic worker fixture validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate synthetic task and receipt
        run: python3 scripts/validate_synthetic_receipt.py
